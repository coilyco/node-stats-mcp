# Tests on every pull request to main and every push to main, then publishes
# the node-stats-mcp image to Forgejo OCI from refs/heads/main only, whatever
# the event. The publish job runs on the runner that holds the registry token,
# so a pull_request or a branch dispatch must never reach it. No deploy stage
# here: rollout is driven from
# coilyco-bridge/deploy/services/node-stats-mcp per the layer invariant
# (source -> deploy).
name: build-publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src tests
      - run: just browser-install
      - run: just check-views

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: deploy
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image
        run: bash scripts/publish-image.sh
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
