[project]
name = "node-stats-mcp"
version = "0.1.0"
description = "Node-local MCP battery with streamable-HTTP tools and bounded OTLP export."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Kai Ase Siren" }]
dependencies = [
  "mcp>=1.14.0",
  "psutil>=6.0.0",
  "sentry-sdk>=2.0,<3",
]

[project.scripts]
node-stats-mcp = "node_stats_mcp.__main__:main"
node-stats-exporter = "node_stats_mcp.exporter:main"

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/node_stats_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "RUF"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "node_stats_mcp.server"
# FastMCP's tool() decorator is untyped; registering through it trips
# no-untyped-call under strict mode. The tool bodies themselves stay typed.
disable_error_code = ["no-untyped-call"]

[dependency-groups]
dev = [
  "mypy>=1.20.0",
  "pre-commit>=4.5.1",
  "ruff>=0.15.10",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Per-repo opt-outs for agentic-os pre-commit hooks (agentic_os/config.py).

[tool.agentic-os.repo-pointer-skills]
# Every fleet repo lives under the coilyco org.
org = "coilyco"

[tool.agentic-os.issue-reference-guard]
enabled = true

[tool.agentic-os.documentation-layout]
# Large, not small. `small` was stamped fleet-wide by the agentic-os#1108
# sweep rather than chosen, and its per-file cap is half the pre-band flat cap,
# so advancing the pin makes previously-legal content illegal. See inbox#439.
band = "large"

# The managed markers are stamped inside the pre-commit YAML and
# cannot form a single top-of-file comment block.
[tool.agentic-os.code-comments]
excludes = [".pre-commit-config.yaml"]
