<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node stats</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --series: #2a78d6;
  --track: #cde2fb;
  --warning: #fab219;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --series: #3987e5;
    --track: #184f95;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --grid: #2c2c2a;
  --axis: #383835;
  --series: #3987e5;
  --track: #184f95;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--surface);
  color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.hero { margin: 4px 0 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero b { font-size: 48px; line-height: 1; font-weight: 600; }
.hero span { color: var(--ink-2); }
.row { margin: 0 0 16px; }
.row-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.sub { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.value { white-space: nowrap; font-size: 13px; }
.bar { position: relative; display: flex; gap: 2px; height: 16px; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.bar > .fill { background: var(--series); }
.bar > .rest { background: var(--track); flex: 1 1 0; }
.bar > .warn { background: var(--warning); }
.bar > .crit { background: var(--critical); }
.bar > .tick { position: absolute; top: -3px; bottom: -3px; width: 1px; min-width: 1px; border-radius: 0; background: var(--ink-3); }
.flag { font-size: 12px; margin-top: 4px; color: var(--ink-2); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 12px; color: var(--ink-2); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.note { color: var(--ink-2); font-size: 12px; margin: 0 0 12px; }
details { margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 8px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); overflow-wrap: anywhere; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
#status { color: var(--ink-2); }
.cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0 16px; }
.cores .row { margin-bottom: 10px; }
.items { list-style: none; margin: 0 0 16px; padding: 0; }
.items li { padding: 6px 0; border-bottom: 1px solid var(--grid); overflow-wrap: anywhere; }
.items .bad { font-weight: 600; }
.live { margin: 0 0 16px; padding-top: 8px; border-top: 1px solid var(--grid); }
.live h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.live button { font: inherit; font-size: 12px; padding: 4px 12px; margin-right: 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 4px; cursor: pointer; }
.spark { display: inline-flex; align-items: flex-end; gap: 1px; height: 22px; width: 120px; vertical-align: middle; margin-right: 8px; }
.spark > i { display: block; flex: 1 1 0; min-height: 1px; background: var(--series); }
.moved { font-weight: 600; }
caption { text-align: left; color: var(--ink-2); font-size: 12px; padding-top: 8px; }
</style>
</head>
<body>
<h1 id="title">Node stats</h1>
<p id="status" role="status">Waiting for the tool result.</p>
<main id="view" hidden></main>
<script>
"use strict";
const CONFIG = __NODE_STATS_VIEW_CONFIG__;
const PROTOCOL_VERSION = "2026-01-26";

function bytes(n) {
  if (typeof n !== "number" || !isFinite(n)) return "n/a";
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? String(n) : n.toFixed(n >= 100 ? 0 : 1)) + " " + units[i];
}
function pct(n) { return typeof n === "number" ? n.toFixed(1) + "%" : "n/a"; }
function clamp(n) { return Math.max(0, Math.min(100, n)); }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function table(headers, rows) {
  return h("details", {},
    h("summary", {}, "Table view"),
    h("table", {},
      h("thead", {}, h("tr", {}, headers.map((t, i) => h("th", { class: i ? "num" : "" }, t)))),
      h("tbody", {}, rows.map(r => h("tr", {}, r.map((c, i) => h("td", { class: i ? "num" : "" }, c)))))));
}

function severity(percent) {
  if (percent >= CONFIG.criticalPercent) return "critical";
  if (percent >= CONFIG.warnPercent) return "warning";
  return null;
}

function renderDisk(data) {
  const parts = Array.isArray(data.partitions) ? data.partitions : [];
  const charted = new Map();
  for (const p of parts) {
    const u = p.usage || {};
    if (!(u.total > 0)) continue;
    const key = [p.device, u.total, u.used, u.free].join("|");
    const row = charted.get(key) || { device: p.device, fstype: p.fstype, usage: u, mounts: [], options: p.options || [] };
    row.mounts.push(p.mountpoint);
    charted.set(key, row);
  }
  const rows = [...charted.values()].sort((a, b) => b.usage.percent - a.usage.percent);
  const unreadable = parts.filter(p => !(p.usage && p.usage.total > 0)).length;
  const out = [];

  if (rows.length) {
    const top = rows[0];
    out.push(h("div", { class: "hero" }, h("b", {}, pct(top.usage.percent)), h("span", {}, "of the fullest filesystem used, " + top.device)));
  }
  for (const r of rows) {
    const sev = severity(r.usage.percent);
    const more = r.mounts.length > 1 ? " and " + (r.mounts.length - 1) + " more" : "";
    const detail = `${r.device}: ${pct(r.usage.percent)} used, ${bytes(r.usage.used)} of ${bytes(r.usage.total)}, ${bytes(r.usage.free)} free`;
    const width = clamp(r.usage.percent);
    out.push(h("div", { class: "row" },
      h("div", { class: "row-head" },
        h("div", {}, h("div", { class: "name" }, r.device), h("div", { class: "sub" }, r.fstype + " at " + r.mounts[0] + more)),
        h("div", { class: "value" }, `${pct(r.usage.percent)} // ${bytes(r.usage.used)} of ${bytes(r.usage.total)}`)),
      h("div", { class: "bar", role: "img", tabindex: "0", "aria-label": detail + (sev ? ", " + sev : ""), title: detail },
        h("i", { class: "fill" + (sev === "critical" ? " crit" : sev === "warning" ? " warn" : ""), style: `flex: 0 0 ${width}%` }),
        h("i", { class: "rest" }),
        h("i", { class: "tick", style: `left: ${clamp(CONFIG.warnPercent)}%`, "aria-hidden": "true" }),
        h("i", { class: "tick", style: `left: ${clamp(CONFIG.criticalPercent)}%`, "aria-hidden": "true" })),
      sev ? h("div", { class: "flag" }, (sev === "critical" ? "✕ Critical" : "▲ Warning") + `: at or above ${sev === "critical" ? CONFIG.criticalPercent : CONFIG.warnPercent}%`) : null));
  }
  if (rows.length) {
    out.push(h("p", { class: "note" }, `Ticks mark the warning (${CONFIG.warnPercent}%) and critical (${CONFIG.criticalPercent}%) thresholds.`));
  } else {
    out.push(h("p", { class: "note" }, "No mount reported usage, so there is nothing to chart."));
  }
  if (unreadable) {
    out.push(h("p", { class: "note" }, `${unreadable} of ${parts.length} mounts reported no usage and are not charted. The text result lists them.`));
  }
  out.push(table(["Device", "Mounts", "Used", "Free", "Total", "Percent"],
    rows.map(r => [r.device, r.mounts.join(", "), bytes(r.usage.used), bytes(r.usage.free), bytes(r.usage.total), pct(r.usage.percent)])));
  return out;
}

function stackedRow(name, total, used, usedLabel, restLabel, percent) {
  const width = total > 0 ? clamp((used / total) * 100) : 0;
  const detail = `${name}: ${pct(percent)} used, ${usedLabel} ${bytes(used)}, ${restLabel} ${bytes(total - used)}, of ${bytes(total)}`;
  return h("div", { class: "row" },
    h("div", { class: "row-head" },
      h("div", { class: "name" }, name),
      h("div", { class: "value" }, `${pct(percent)} // ${bytes(used)} of ${bytes(total)}`)),
    h("div", { class: "bar", role: "img", tabindex: "0", "aria-label": detail, title: detail },
      h("i", { class: "fill", style: `flex: 0 0 ${width}%` }),
      h("i", { class: "rest" })));
}

function renderMemory(data) {
  const v = data.virtual || {};
  const s = data.swap || {};
  const out = [];
  out.push(h("div", { class: "hero" }, h("b", {}, pct(v.percent)), h("span", {}, "of " + bytes(v.total) + " memory in use")));
  out.push(h("div", { class: "legend" },
    h("span", {}, h("i", { style: "background: var(--series)" }), "In use"),
    h("span", {}, h("i", { style: "background: var(--track)" }), "Available")));
  const inUse = typeof v.available === "number" ? v.total - v.available : v.used;
  out.push(stackedRow("Memory", v.total, inUse, "in use", "available", v.percent));
  if (s.total > 0) {
    out.push(stackedRow("Swap", s.total, s.used, "used", "free", s.percent));
  } else {
    out.push(h("p", { class: "note" }, "No swap is configured."));
  }
  out.push(h("p", { class: "note" }, "In use is total minus available, so cache the kernel can reclaim counts as available."));
  const fields = (label, obj) => Object.entries(obj)
    .filter(([, n]) => typeof n === "number")
    .map(([k, n]) => [label + " " + k, /percent$/.test(k) ? pct(n) : /^(sin|sout)$/.test(k) ? bytes(n) + " cumulative" : bytes(n)]);
  out.push(table(["Field", "Value"], [...fields("memory", v), ...fields("swap", s)]));
  return out;
}

function num(n) { return typeof n === "number" && isFinite(n) ? n.toLocaleString("en-US") : "n/a"; }
function duration(seconds) {
  if (typeof seconds !== "number" || !isFinite(seconds)) return "n/a";
  const d = Math.floor(seconds / 86400), hr = Math.floor((seconds % 86400) / 3600), m = Math.floor((seconds % 3600) / 60);
  return d ? `${d}d ${hr}h` : hr ? `${hr}h ${m}m` : `${m}m`;
}
function fixed(n, digits) { return typeof n === "number" && isFinite(n) ? n.toFixed(digits) : "n/a"; }

function bar(width, cls, ticks) {
  return h("div", { class: "bar", "aria-hidden": "true" },
    h("i", { class: "fill" + (cls ? " " + cls : ""), style: `flex: 0 0 ${clamp(width)}%` }),
    h("i", { class: "rest" }),
    (ticks || []).map(t => h("i", { class: "tick", style: `left: ${clamp(t)}%` })));
}

// One labelled bar. The aria-label carries the whole reading, so no value rests on the bar alone.
function gauge(name, sub, valueText, width, detail, cls, ticks) {
  const row = h("div", { class: "row" },
    h("div", { class: "row-head" },
      h("div", {}, h("div", { class: "name" }, name), sub ? h("div", { class: "sub" }, sub) : null),
      h("div", { class: "value" }, valueText)),
    bar(width, cls, ticks));
  row.setAttribute("role", "img");
  row.setAttribute("tabindex", "0");
  row.setAttribute("aria-label", detail);
  return row;
}

function hero(big, text) { return h("div", { class: "hero" }, h("b", {}, big), h("span", {}, text)); }
function note(text) { return h("p", { class: "note" }, text); }
function errorsNote(errors) {
  return Array.isArray(errors) && errors.length ? note("The tool reported errors: " + errors.join("; ")) : null;
}

function renderSystem(data) {
  const m = data.memory || {};
  const load = Array.isArray(data.load_avg_1_5_15) ? data.load_avg_1_5_15 : [];
  const users = Array.isArray(data.logged_in_users) ? data.logged_in_users : [];
  const inUse = typeof m.available === "number" ? m.total - m.available : m.used;
  const out = [hero(pct(data.cpu_percent), "of CPU in use, sampled over a fraction of a second")];
  out.push(gauge("CPU", null, pct(data.cpu_percent), data.cpu_percent || 0, "CPU: " + pct(data.cpu_percent) + " in use"));
  out.push(stackedRow("Memory", m.total, inUse, "in use", "available", m.percent));
  out.push(h("div", { class: "row" },
    h("div", { class: "row-head" }, h("div", { class: "name" }, "Load average"),
      h("div", { class: "value" }, load.map(n => fixed(n, 2)).join(" / ") + " (1, 5, 15 min)"))));
  out.push(note("Load has no scale of its own until it meets the core count. get_cpu_info charts it against the cores."));
  out.push(h("div", { class: "row" },
    h("div", { class: "row-head" }, h("div", { class: "name" }, "Uptime"),
      h("div", { class: "value" }, duration(data.uptime_seconds) + ", booted " + (typeof data.boot_time_epoch === "number" ? new Date(data.boot_time_epoch * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC" : "n/a")))));
  out.push(note(users.length ? users.length + " logged in: " + users.map(u => u.name + (u.host ? "@" + u.host : "")).join(", ") : "No logged-in users."));
  out.push(table(["Field", "Value"], [
    ["CPU", pct(data.cpu_percent)], ["Memory in use", pct(m.percent)], ["Memory total", bytes(m.total)],
    ["Load 1 min", fixed(load[0], 2)], ["Load 5 min", fixed(load[1], 2)], ["Load 15 min", fixed(load[2], 2)],
    ["Uptime", duration(data.uptime_seconds)], ["Logged-in users", String(users.length)],
  ]));
  return out;
}

function renderCpu(data) {
  const cores = Array.isArray(data.per_core_percent) ? data.per_core_percent : [];
  const load = Array.isArray(data.load_avg_1_5_15) ? data.load_avg_1_5_15 : [];
  const logical = data.logical_cores;
  const out = [hero(pct(data.percent), `of CPU in use across ${logical || "n/a"} logical cores${data.physical_cores ? " (" + data.physical_cores + " physical)" : ""}`)];
  out.push(h("div", { class: "cores" }, cores.map((p, i) =>
    gauge("Core " + i, null, pct(p), p, `Core ${i}: ${pct(p)} in use`))));
  const labels = ["1 min", "5 min", "15 min"];
  load.forEach((l, i) => {
    const per = logical > 0 ? (l / logical) * 100 : 0;
    out.push(gauge("Load " + labels[i], null, `${fixed(l, 2)} on ${logical || "n/a"} cores`, Math.min(per, 100),
      `Load over ${labels[i]}: ${fixed(l, 2)} on ${logical || "n/a"} logical cores, ${fixed(per, 0)}% of one runnable task per core`, null, [100]));
  });
  out.push(note("A full bar is one runnable task per logical core. On Linux the load figure also counts tasks waiting on disk."));
  out.push(table(["Field", "Value"], [
    ["CPU", pct(data.percent)], ["Logical cores", num(logical)], ["Physical cores", num(data.physical_cores)],
    ...load.map((l, i) => ["Load " + labels[i], fixed(l, 2)]),
    ...cores.map((p, i) => ["Core " + i, pct(p)]),
  ]));
  return out;
}

function renderPressure(data) {
  const r = data.root || {};
  const warn = r.warn_percent, crit = r.critical_percent;
  const sev = r.status === "critical" ? "critical" : r.status === "warning" ? "warning" : null;
  const detail = `${r.path || "/"}: ${pct(r.used_percent)} used, ${bytes(r.pressure_used_bytes)} of ${bytes(r.total_bytes)}, status ${r.status}`;
  const out = [hero(pct(r.used_percent), "of the root filesystem used at " + (r.path || "/"))];
  const row = gauge("Root filesystem", bytes(r.available_bytes) + " available to non-root", `${pct(r.used_percent)} // ${bytes(r.pressure_used_bytes)} of ${bytes(r.total_bytes)}`,
    r.used_percent || 0, detail + (sev ? ", " + sev : ""), sev === "critical" ? "crit" : sev === "warning" ? "warn" : null, [warn, crit]);
  if (sev) row.append(h("div", { class: "flag" }, (sev === "critical" ? "✕ Critical" : "▲ Warning") + `: at or above ${sev === "critical" ? crit : warn}%`));
  out.push(row);
  const runway = (label, until, over, limit) => until > 0 ? `${bytes(until)} until ${label} (${limit}%)` : `${bytes(over)} over ${label} (${limit}%)`;
  out.push(h("ul", { class: "items" },
    h("li", {}, runway("warning", r.bytes_until_warn, r.bytes_over_warn, warn)),
    h("li", {}, runway("critical", r.bytes_until_critical, r.bytes_over_critical, crit))));
  if (r.inodes_total > 0) {
    out.push(gauge("Inodes", `${num(r.inodes_total - r.inodes_available)} of ${num(r.inodes_total)} used`, pct(r.inodes_used_percent),
      r.inodes_used_percent || 0, `Inodes: ${pct(r.inodes_used_percent)} used of ${num(r.inodes_total)}`));
    out.push(note("The server configures no inode threshold, so the inode bar has no status color."));
  } else {
    out.push(note("This filesystem reports no inode counts."));
  }
  out.push(note(`Used counts blocks only root can write as unavailable, so it can read higher than the percent in get_disk_info. Ticks mark the warning (${warn}%) and critical (${crit}%) thresholds.`));
  out.push(table(["Field", "Value"], [
    ["Total", bytes(r.total_bytes)], ["Used for pressure", bytes(r.pressure_used_bytes)], ["Available", bytes(r.available_bytes)],
    ["Reserved", bytes(r.reserved_bytes)], ["Used", pct(r.used_percent)], ["Status", String(r.status)],
    ["Until warning", bytes(r.bytes_until_warn)], ["Until critical", bytes(r.bytes_until_critical)],
    ["Inodes total", num(r.inodes_total)], ["Inodes available", num(r.inodes_available)], ["Inodes used", pct(r.inodes_used_percent)],
  ]));
  return out;
}

// Counters only mean something as movement, and one tool call is one reading. With a host that
// proxies tools/call the View takes more readings itself and keeps the series. It never opens a
// connection: the request goes to the host over postMessage like the handshake does.
const WATCH_MS = 5000;
const WATCH_MAX = 24;
let lastData = null;
let lastArguments = {};
let watching = null;
const HOST = { serverTools: false };

function groupsNetwork(data) {
  return Object.entries(data.per_interface || {}).map(([name, c]) => ({
    label: name,
    rates: { received: c.bytes_recv, sent: c.bytes_sent },
    counts: { errin: c.errin, errout: c.errout, dropin: c.dropin, dropout: c.dropout },
  }));
}
function groupsConntrack(data) {
  return [{ label: "conntrack", rates: {}, counts: data.totals || {} }];
}

function readResult(result) {
  if (result && result.isError) throw new Error("the tool returned an error");
  let data = result && result.structuredContent;
  if (!data) data = JSON.parse(result.content.find(c => c.type === "text").text);
  return data;
}

function stopWatching() {
  if (watching) { clearTimeout(watching.timer); watching.running = false; }
}

function livePanel(groupsOf) {
  const box = h("section", { class: "live" }, h("h2", {}, "Movement"));
  if (!HOST.serverTools) {
    box.append(note("This host does not proxy tool calls, so the view cannot take a second reading. Call the tool twice and compare the counters."));
    return box;
  }
  const body = h("div", {});
  const start = h("button", { type: "button" }, "Watch movement");
  const stop = h("button", { type: "button", hidden: true }, "Stop");
  const base = new Map(groupsOf(lastData).map(g => [g.label, g]));
  const state = { running: false, timer: null, prev: null, prevAt: 0, series: new Map(), counts: new Map(), samples: 0, message: "" };
  const paint = () => {
    const kids = [];
    if (state.message) kids.push(note(state.message));
    if (!state.samples) kids.push(note(`Counters are cumulative, so one reading cannot show a fault. Watching takes a reading every ${WATCH_MS / 1000} seconds for up to ${WATCH_MAX} readings.`));
    for (const [label, rates] of state.series) {
      const counts = state.counts.get(label) || {};
      const moved = Object.entries(counts).filter(([, n]) => n > 0);
      const line = h("div", { class: "row" }, h("div", { class: "name" }, label));
      for (const [metric, values] of Object.entries(rates)) {
        const peak = Math.max(...values, 1);
        const latest = values[values.length - 1];
        const text = `${metric} ${bytes(latest)}/s`;
        const spark = h("span", { class: "spark", role: "img", "aria-label": `${label} ${text}, ${values.length} readings, peak ${bytes(peak)}/s` },
          values.map(v => h("i", { style: `height: ${Math.round((v / peak) * 100)}%` })));
        line.append(h("div", { class: "sub" }, spark, text));
      }
      line.append(h("div", { class: "sub" + (moved.length ? " moved" : "") },
        moved.length ? "▲ Moved since the first reading: " + moved.map(([k, n]) => `${k} +${num(n)}`).join(", ") : "No error or drop counter has moved."));
      kids.push(line);
    }
    body.replaceChildren(...kids);
    start.hidden = state.running;
    stop.hidden = !state.running;
  };
  const sample = async () => {
    try {
      const data = readResult(await request("tools/call", { name: CONFIG.tool, arguments: lastArguments }));
      const now = performance.now();
      const groups = groupsOf(data);
      for (const g of groups) {
        const b = base.get(g.label);
        if (!b) continue;
        const counts = {};
        for (const [k, n] of Object.entries(g.counts)) {
          // A counter that went backward was reset, and the n > 0 filter in paint() skips it.
          counts[k] = n - (b.counts[k] || 0);
        }
        state.counts.set(g.label, counts);
        const prev = state.prev && state.prev.get(g.label);
        if (prev && Object.keys(g.rates).length) {
          const seconds = (now - state.prevAt) / 1000;
          const series = state.series.get(g.label) || {};
          for (const [k, n] of Object.entries(g.rates)) {
            const rate = Math.max(0, (n - prev.rates[k]) / seconds);
            series[k] = [...(series[k] || []), rate].slice(-WATCH_MAX);
          }
          state.series.set(g.label, series);
        } else if (!state.series.has(g.label)) {
          state.series.set(g.label, {});
        }
      }
      state.prev = new Map(groups.map(g => [g.label, g]));
      state.prevAt = now;
      state.samples++;
      state.message = "";
    } catch (e) {
      state.running = false;
      state.message = "The host refused a second reading: " + e.message;
    }
    if (state.samples >= WATCH_MAX) state.running = false;
    paint();
    if (state.running) state.timer = setTimeout(sample, WATCH_MS);
  };
  start.addEventListener("click", () => {
    stopWatching();
    state.running = true; state.samples = 0; state.prev = null; state.series.clear(); state.counts.clear(); state.message = "";
    watching = state;
    paint();
    sample();
  });
  stop.addEventListener("click", () => { state.running = false; clearTimeout(state.timer); paint(); });
  paint();
  box.append(h("div", {}, start, stop), body);
  return box;
}

function renderNetwork(data) {
  const per = Object.entries(data.per_interface || {});
  const total = data.total || {};
  const filtering = data.filtering || {};
  const out = [hero(bytes(total.bytes_recv), "received and " + bytes(total.bytes_sent) + " sent since boot")];
  out.push(note("These are lifetime counters. A non-zero error or drop count says nothing until it moves between two readings. Per interface, the upper bar is received and the lower is sent, both scaled to the busiest direction."));
  const lifetime = (c) => (c.errin || c.errout || c.dropin || c.dropout)
    ? `errors ${num(c.errin)} in / ${num(c.errout)} out, drops ${num(c.dropin)} in / ${num(c.dropout)} out`
    : "no errors or drops";
  const peak = Math.max(1, ...per.map(([, c]) => Math.max(c.bytes_recv || 0, c.bytes_sent || 0)));
  for (const [name, c] of per) {
    out.push(h("div", { class: "row" },
      h("div", { class: "row-head" }, h("div", { class: "name" }, name), h("div", { class: "value" }, `${bytes(c.bytes_recv)} in // ${bytes(c.bytes_sent)} out`)),
      bar(((c.bytes_recv || 0) / peak) * 100, null), bar(((c.bytes_sent || 0) / peak) * 100, null),
      h("div", { class: "sub" }, lifetime(c))));
  }
  if (!per.length) out.push(note("No interface matched the request."));
  if (filtering.mode === "default" && filtering.omitted) out.push(note(`${filtering.omitted} virtual interfaces are left out. Call the tool with interfaces set to all for every one.`));
  if (filtering.mode === "named" && (filtering.not_present || []).length) out.push(note("Not present: " + filtering.not_present.join(", ")));
  out.push(livePanel(groupsNetwork));
  out.push(table(["Interface", "Received", "Sent", "Packets in", "Packets out", "Errors in", "Errors out", "Drops in", "Drops out"],
    per.map(([n, c]) => [n, bytes(c.bytes_recv), bytes(c.bytes_sent), num(c.packets_recv), num(c.packets_sent), num(c.errin), num(c.errout), num(c.dropin), num(c.dropout)])));
  return out;
}

function renderConntrack(data) {
  const totals = Object.entries(data.totals || {});
  const out = [];
  if (typeof data.count === "number" && data.max > 0) {
    const percent = (data.count / data.max) * 100;
    out.push(hero(pct(percent), `of the connection tracking table in use, ${num(data.count)} of ${num(data.max)}`));
    out.push(gauge("Tracked connections", null, `${num(data.count)} of ${num(data.max)}`, percent, `Connection tracking: ${num(data.count)} of ${num(data.max)} entries, ${pct(percent)}`));
    out.push(note("This is a gauge. A table that fills and drains between two readings does not show here."));
  } else {
    out.push(note("The connection tracking table could not be read, so there is no count to chart."));
  }
  for (const n of data.notes || []) out.push(h("p", { class: "flag" }, "▲ " + n));
  out.push(note("The error totals are lifetime counters summed across CPUs. insert_failed, drop and early_drop are the ones an egress fault turns up in."));
  // Without totals there is no counter to watch, and a panel that says nothing moved would read as a clean bill.
  if (totals.length) out.push(livePanel(groupsConntrack));
  out.push(table(["Counter", "Total"], [["count", num(data.count)], ["max", num(data.max)], ...totals.map(([k, n]) => [k, num(n)])]));
  return out;
}

function containerLine(c) {
  const s = c.state_detail || {}, l = c.last_state || {};
  const now = s.reason ? s.reason + (typeof s.exit_code === "number" ? " exit " + s.exit_code : "") : (c.state || "unknown");
  const before = l.reason ? "; last " + l.reason + (typeof l.exit_code === "number" ? " exit " + l.exit_code : "") : "";
  return `${c.name}: ${now}${before}${c.restart_count ? ", " + c.restart_count + " restarts" : ""}`;
}

function renderPods(data) {
  const pods = Array.isArray(data.pods) ? data.pods : [];
  const ok = (p) => p.phase === "Succeeded" || (p.phase === "Running" && (p.containers || []).every(c => c.ready));
  const bad = pods.filter(p => !ok(p));
  const running = pods.filter(p => p.phase === "Running").length;
  const out = [hero(`${running} of ${pods.length}`, "pods shown are Running" + (bad.length ? `, ${bad.length} need attention` : ", none need attention"))];
  if (bad.length) {
    out.push(h("ul", { class: "items" }, bad.slice(0, 20).map(p => h("li", {},
      h("div", { class: "bad" }, `✕ ${p.namespace}/${p.pod}: ${p.phase}${p.reason ? " (" + p.reason + ")" : ""}`),
      (p.containers || []).concat(p.init_containers || []).filter(c => !c.ready).map(c => h("div", { class: "sub" }, containerLine(c)))))));
    if (bad.length > 20) out.push(note(`${bad.length - 20} more are in the table.`));
  }
  const restarted = pods.filter(p => ok(p) && p.restart_count > 0);
  if (restarted.length) out.push(note("Restarted but healthy now: " + restarted.map(p => `${p.pod} (${p.restart_count})`).join(", ")));
  if (typeof data.pod_count === "number" && data.pod_count > pods.length) out.push(note(`Showing ${pods.length} of ${data.pod_count} pods. Unhealthy pods sort first, so the cut never hides one.`));
  out.push(errorsNote(data.errors));
  out.push(table(["Namespace", "Pod", "Phase", "Ready", "Restarts", "Age"],
    pods.map(p => [p.namespace, p.pod, p.phase + (p.reason ? " (" + p.reason + ")" : ""),
      `${(p.containers || []).filter(c => c.ready).length}/${(p.containers || []).length}`, num(p.restart_count), p.age || "n/a"])));
  return out;
}

function renderWorkloads(data) {
  const items = Array.isArray(data.workloads) ? data.workloads : [];
  const behind = items.filter(w => w.rollout_complete === false);
  const out = [hero(`${items.length - behind.length} of ${items.length}`, "workloads shown are fully rolled out" + (behind.length ? `, ${behind.length} behind` : ""))];
  for (const w of items) {
    const desired = w.desired_replicas || 0, ready = w.ready_replicas || 0;
    const cls = w.rollout_complete === false ? "warn" : null;
    const detail = `${w.kind} ${w.namespace}/${w.name}: ${ready} ready, ${w.updated_replicas || 0} updated, ${w.available_replicas || 0} available, of ${desired} desired`;
    const row = gauge(w.name, `${w.kind} in ${w.namespace}`, desired ? `${ready}/${desired} ready` : "scaled to 0",
      desired ? (ready / desired) * 100 : 0, detail + (cls ? ", rollout incomplete" : ""), cls);
    if (cls) row.append(h("div", { class: "flag" }, `▲ Rollout incomplete: ${w.updated_replicas || 0} of ${desired} updated, generation ${w.observed_generation ?? "n/a"} of ${w.generation ?? "n/a"} observed`));
    out.push(row);
  }
  if (!items.length) out.push(note("No workload matched."));
  if (typeof data.workload_count === "number" && data.workload_count > items.length) out.push(note(`Showing ${items.length} of ${data.workload_count} workloads, incomplete rollouts first.`));
  out.push(note("Replica counts describe the spec and the rollout, and the table lists the spec image. A running pod can still report another image until the rollout lands."));
  out.push(errorsNote(data.errors));
  out.push(table(["Kind", "Namespace", "Name", "Desired", "Ready", "Updated", "Available", "Rollout", "Spec image"],
    items.map(w => [w.kind, w.namespace, w.name, num(w.desired_replicas), num(w.ready_replicas), num(w.updated_replicas), num(w.available_replicas),
      w.rollout_complete === true ? "complete" : w.rollout_complete === false ? "incomplete" : "n/a", (w.spec_images || []).map(i => i.image).join(", ")])));
  return out;
}

function conditionOk(c) {
  // Ready is healthy when True. Every other node condition (pressure, unavailable) is healthy when False.
  return c.type === "Ready" ? c.status === "True" : c.status === "False";
}

function renderNodeHealth(data) {
  const node = data.node;
  if (!node) return [note("No node was returned."), errorsNote(data.errors), table(["Field", "Value"], [["Node", "none"]])];
  const conds = node.conditions || [];
  const events = Array.isArray(data.events) ? data.events : [];
  const ready = conds.find(c => c.type === "Ready");
  const bad = conds.filter(c => !conditionOk(c));
  const warnings = events.filter(e => e.type === "Warning");
  const out = [hero(ready ? (ready.status === "True" ? "Ready" : "Not Ready") : "Unknown", `${node.name}, ${bad.length ? bad.length + (bad.length > 1 ? " conditions need" : " condition needs") + " attention" : "no condition needs attention"}`)];
  out.push(h("ul", { class: "items" }, conds.map(c => h("li", { class: conditionOk(c) ? "" : "bad" },
    `${conditionOk(c) ? "✓" : "✕"} ${c.type}: ${c.status}`,
    h("div", { class: "sub" }, [c.reason, c.last_transition_age ? "since " + c.last_transition_age + " ago" : null].filter(Boolean).join(", "))))));
  if (node.unschedulable) out.push(h("div", { class: "flag" }, "▲ The node is cordoned (unschedulable)."));
  const taints = node.taints || [];
  out.push(note(taints.length ? "Taints: " + taints.map(t => `${t.key}${t.value ? "=" + t.value : ""}:${t.effect}`).join(", ") : "No taints."));
  out.push(note(`${warnings.length} warning event${warnings.length === 1 ? "" : "s"} among ${events.length} returned` + (data.event_count > events.length ? ` of ${data.event_count}` : "") + `, within ${data.max_age_hours}h.`));
  if (warnings.length) {
    out.push(h("ul", { class: "items" }, warnings.slice(0, 10).map(e => h("li", {},
      h("div", { class: "bad" }, `▲ ${e.reason}: ${(e.object || {}).kind}/${(e.object || {}).name}${e.count > 1 ? " x" + e.count : ""}, ${e.age || "n/a"} ago`),
      h("div", { class: "sub" }, e.message || "")))));
  }
  out.push(errorsNote(data.errors));
  const cap = node.capacity || {}, alloc = node.allocatable || {};
  out.push(h("details", {},
    h("summary", {}, "Table view"),
    h("table", {}, h("caption", {}, "Conditions"),
      h("thead", {}, h("tr", {}, ["Type", "Status", "Reason", "Since"].map(t => h("th", {}, t)))),
      h("tbody", {}, conds.map(c => h("tr", {}, [c.type, c.status, c.reason || "", c.last_transition_age || ""].map(v => h("td", {}, v)))))),
    h("table", {}, h("caption", {}, "Capacity and allocatable"),
      h("thead", {}, h("tr", {}, ["Resource", "Capacity", "Allocatable"].map(t => h("th", {}, t)))),
      h("tbody", {}, Object.keys(cap).map(k => h("tr", {}, [k, cap[k], alloc[k] ?? ""].map(v => h("td", {}, String(v))))))),
    h("table", {}, h("caption", {}, "Events"),
      h("thead", {}, h("tr", {}, ["Type", "Reason", "Object", "Age", "Count", "Message"].map(t => h("th", {}, t)))),
      h("tbody", {}, events.map(e => h("tr", {}, [e.type, e.reason, `${(e.object || {}).kind}/${(e.object || {}).name}`, e.age || "", e.count ?? "", e.message || ""].map(v => h("td", {}, String(v)))))))));
  return out;
}

const VIEWS = {
  disk: ["Disk usage", renderDisk],
  memory: ["Memory usage", renderMemory],
  system: ["System snapshot", renderSystem],
  cpu: ["CPU", renderCpu],
  pressure: ["Filesystem pressure", renderPressure],
  network: ["Network counters", renderNetwork],
  conntrack: ["Connection tracking", renderConntrack],
  "k3s-pods": ["k3s pods", renderPods],
  "k3s-workloads": ["k3s workloads", renderWorkloads],
  "k3s-node-health": ["k3s node health", renderNodeHealth],
};

function show(data) {
  const view = document.getElementById("view");
  const [title, render] = VIEWS[CONFIG.kind];
  stopWatching();
  lastData = data;
  const nodes = render(data);
  document.getElementById("title").textContent = title;
  document.getElementById("status").hidden = true;
  view.replaceChildren(...nodes.filter(Boolean));
  view.hidden = false;
}

function fail(message) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.hidden = false;
  document.getElementById("view").hidden = true;
}

function onToolResult(result) {
  if (result && result.isError) return fail("The tool returned an error. The text result has the detail.");
  let data = result && result.structuredContent;
  if (!data) {
    try { data = JSON.parse(result.content.find(c => c.type === "text").text); } catch (e) { data = null; }
  }
  if (!data || typeof data !== "object") return fail("This view could not read the tool result. The text result is unchanged.");
  show(data);
}

const pending = new Map();
let nextId = 1;
function send(message) { window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, message), "*"); }
function request(method, params) {
  const id = nextId++;
  return new Promise((resolve, reject) => { pending.set(id, { resolve, reject }); send({ id, method, params }); });
}
function applyTheme(ctx) {
  if (ctx && (ctx.theme === "light" || ctx.theme === "dark")) document.documentElement.dataset.theme = ctx.theme;
}

window.addEventListener("message", (event) => {
  const m = event.data;
  if (event.source !== window.parent || !m || m.jsonrpc !== "2.0") return;
  if (m.method === undefined && pending.has(m.id)) {
    const p = pending.get(m.id);
    pending.delete(m.id);
    return m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result);
  }
  if (m.method === "ui/notifications/tool-input") lastArguments = (m.params && m.params.arguments) || {};
  else if (m.method === "ui/notifications/tool-result") onToolResult(m.params);
  else if (m.method === "ui/notifications/tool-cancelled") fail("The tool call was cancelled.");
  else if (m.method === "ui/notifications/host-context-changed") applyTheme(m.params);
  else if (m.id !== undefined && (m.method === "ui/resource-teardown" || m.method === "ping")) {
    if (m.method === "ui/resource-teardown") stopWatching();
    send({ id: m.id, result: {} });
  }
});

if (window.parent === window) {
  fail("This page is an MCP Apps view. It draws a tool result inside a host that supports MCP Apps.");
} else {
  request("ui/initialize", {
    appInfo: { name: "node-stats-" + CONFIG.kind, version: "1.0.0" },
    appCapabilities: {},
    protocolVersion: PROTOCOL_VERSION,
  }).then((init) => {
    applyTheme(init && init.hostContext);
    HOST.serverTools = !!(init && init.hostCapabilities && init.hostCapabilities.serverTools);
    send({ method: "ui/notifications/initialized" });
    let last = "";
    const report = () => requestAnimationFrame(() => {
      const el = document.documentElement;
      const prev = el.style.height;
      el.style.height = "max-content";
      const height = Math.ceil(el.getBoundingClientRect().height);
      el.style.height = prev;
      const size = Math.ceil(window.innerWidth) + "x" + height;
      if (size !== last) { last = size; send({ method: "ui/notifications/size-changed", params: { width: Math.ceil(window.innerWidth), height } }); }
    });
    new ResizeObserver(report).observe(document.documentElement);
    new ResizeObserver(report).observe(document.body);
    report();
  }).catch((e) => fail("The host refused the view handshake: " + e.message));
}
</script>
</body>
