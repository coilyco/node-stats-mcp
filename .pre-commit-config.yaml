repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        # Pinned to what uv.lock resolves, not a floating lower bound. These
        # are the stubs mypy checks the code against, so a drift here type-checks
        # against a library the image never ships. See docs/configuration.md.
        additional_dependencies:
          - psutil==7.2.2
          - mcp==1.28.1

  - repo: local
    hooks:
      - id: trufflehog
        name: trufflehog (secret scan, offline)
        description: Detect secrets in staged changes via local trufflehog binary (no API verification).
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://github.com/coilyco/agentic-os
    rev: aos-precommit-v0.128.0
    hooks:
      - id: catalog-trifecta
      - id: documentation-placement
      - id: documentation-size
      - id: context-load-points
      - id: code-comments
      - id: actions-run-one-line
      - id: source-doc-refs
      - id: check-skills
      - id: check-composed-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
      - id: pr-guard
      - id: brand-case
      - id: leak-guard
      - id: unresolved-placeholder-guard
      - id: git-workflow
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
        exclude: (^|/)\.vscode/
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.(ya?ml)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/zshrc$
        args: [--severity=error]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        # Report, do not rewrite. --force-exclude keeps _typos.toml binding.
        args: [--force-exclude]
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
